<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Video Downloader - Fast & Free HD Reels Saver</title>
  <meta name="description" content="Download Instagram videos, reels, photos, and stories in high-definition (HD) MP4 for free. Super-fast, secure, and no login required.">
  <meta name="keywords" content="instagram video downloader, download instagram reels, insta story saver hd, fastest instagram downloader, save instagram video online free">
  <meta name="robots" content="index, follow">

  <style>
    :root {
      --bg: #0b0f19;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.1);
      --accent: linear-gradient(135deg, #ff3366, #ff6b3d, #c32aa3);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    
    header { text-align: center; margin-top: 35px; margin-bottom: 24px; max-width: 600px; }
    h1 { font-size: 2.2rem; font-weight: 800; background: var(--accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    p.sub { color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    
    .box { background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(16px); border-radius: 20px; padding: 24px; width: 100%; max-width: 520px; box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
    
    /* State 1: Input Box */
    .input-wrapper { position: relative; width: 100%; display: flex; align-items: center; margin-bottom: 14px; }
    input[type="text"] { width: 100%; padding: 16px 90px 16px 16px; background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #ff3366; }
    
    .paste-btn { position: absolute; right: 10px; background: rgba(255, 255, 255, 0.12); border: 1px solid var(--border); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 5px; }
    .paste-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .paste-btn:active { transform: scale(0.95); }

    .btn { width: 100%; padding: 15px 20px; font-size: 1.05rem; font-weight: 700; border-radius: 12px; border: none; cursor: pointer; color: white; background: var(--accent); transition: transform 0.1s, opacity 0.2s; display: flex; justify-content: center; align-items: center; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    /* State 2: Result Box */
    #resultSection { display: none; text-align: center; }
    .preview-card { background: rgba(0,0,0,0.3); border-radius: 14px; padding: 16px; border: 1px solid var(--border); }
    .thumb-container { position: relative; display: inline-block; width: 100%; max-width: 320px; margin-bottom: 14px; }
    .thumb-container img { width: 100%; max-height: 350px; border-radius: 10px; object-fit: cover; }
    .quality-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.75); color: var(--success); font-size: 0.75rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(16, 185, 129, 0.3); }
    
    .video-info { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: #fff; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    
    .reset-link { margin-top: 16px; display: inline-block; color: var(--muted); font-size: 0.9rem; text-decoration: none; cursor: pointer; transition: color 0.2s; }
    .reset-link:hover { color: #fff; }
    
    footer { margin-top: auto; padding: 25px 0; color: var(--muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>Instagram Video Downloader</h1>
    <p class="sub">Download reels, videos, and stories instantly in full HD. 100% Free & Unlimited.</p>
  </header>

  <main class="box">
    <!-- 1. SEARCH SECTION (Input + Initial Button) -->
    <div id="searchSection">
      <div class="input-wrapper">
        <input type="text" id="videoUrl" placeholder="Paste Instagram video/reel link..." autocomplete="off">
        <button type="button" class="paste-btn" onclick="handlePaste()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
          Paste
        </button>
      </div>
      <button class="btn" id="fetchBtn" onclick="handleFetch()">Get Download Link</button>
    </div>

    <!-- 2. RESULT SECTION (Preview + Monitized Download Only) -->
    <div id="resultSection">
      <div class="preview-card">
        <div class="thumb-container">
          <img id="thumbImg" src="" alt="Video Preview">
          <span class="quality-badge">1080p Full HD</span>
        </div>
        <div class="video-info" id="videoTitle">Instagram Reel</div>
        
        <button class="btn" id="dlBtn" onclick="executeSmartDownload()">
          Download HD MP4
        </button>
        
        <div>
          <a class="reset-link" onclick="resetDownloader()">← Download Another Video</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 Insta Video Downloader. Fast, safe & direct streams.</p>
  </footer>

  <script>
    let activeMediaUrl = "";
    // Adsterra Smartlink (Jumping Monetization Link)
    const ADSTERRA_DIRECT_LINK = "https://www.profitableratecpmnetwork.com/x2qz4nip?key=d355fb2b34af3a9f086ff05f70e1da29";

    async function handlePaste() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) document.getElementById("videoUrl").value = text;
      } catch (err) {
        const manual = prompt("Paste your Instagram link here:");
        if (manual) document.getElementById("videoUrl").value = manual;
      }
    }

    async function handleFetch() {
      const urlInput = document.getElementById("videoUrl").value.trim();
      const btn = document.getElementById("fetchBtn");

      if (!urlInput) {
        alert("Please paste a valid Instagram link first.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Extracting HD Video...";

      try {
        const response = await fetch(`/api/info?url=${encodeURIComponent(urlInput)}`);
        const data = await response.json();

        if (response.ok && data.success) {
          activeMediaUrl = data.download_url;
          document.getElementById("videoTitle").innerText = data.title || "Instagram Video";
          
          if (data.thumbnail) {
            document.getElementById("thumbImg").src = data.thumbnail;
          }

          // UI Flow: Search Section hide, Result Section Show
          document.getElementById("searchSection").style.display = "none";
          document.getElementById("resultSection").style.display = "block";
        } else {
          alert(data.detail || "Could not fetch video. Please make sure the account is public.");
        }
      } catch (err) {
        alert("Server connection failed. Please try again.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Get Download Link";
      }
    }

    function executeSmartDownload() {
      if (!activeMediaUrl) return;

      // 1. ADSTERRA JUMP: Opens directly in a clean new tab instantly (Passes Chrome pop-up blocker)
      const adWindow = window.open(ADSTERRA_DIRECT_LINK, "_blank");

      // 2. INTERNAL CHROME BACKGROUND DOWNLOAD:
      // Using an invisible iframe pointing directly to the download stream
      // This forces Chrome to capture it into the device's native Download Manager
      const dlFrame = document.createElement("iframe");
      dlFrame.style.display = "none";
      dlFrame.src = activeMediaUrl;
      document.body.appendChild(dlFrame);

      // Fallback anchor tag click in background
      const fallbackAnchor = document.createElement("a");
      fallbackAnchor.href = activeMediaUrl;
      fallbackAnchor.setAttribute("download", "instagram_video.mp4");
      fallbackAnchor.style.display = "none";
      document.body.appendChild(fallbackAnchor);
      fallbackAnchor.click();

      // Clean memory
      setTimeout(() => {
        if (dlFrame) document.body.removeChild(dlFrame);
        if (fallbackAnchor) document.body.removeChild(fallbackAnchor);
      }, 4000);
    }

    function resetDownloader() {
      document.getElementById("videoUrl").value = "";
      document.getElementById("resultSection").style.display = "none";
      document.getElementById("searchSection").style.display = "block";
      activeMediaUrl = "";
    }
  </script>
</body>
</html>
