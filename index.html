<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Video Downloader - Fast & Secure HD Saver</title>
  <meta name="description" content="Download high-definition videos securely across mobile and desktop devices.">
  <meta name="robots" content="index, follow">

  <style>
    :root {
      --bg: #0b0f19;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.1);
      --accent: linear-gradient(135deg, #ff3366, #ff6b3d, #c32aa3);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    
    header { text-align: center; margin-top: 25px; margin-bottom: 20px; max-width: 600px; }
    h1 { font-size: 2.1rem; font-weight: 800; background: var(--accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    p.sub { color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    
    /* RESERVED AD SLOTS */
    .ad-slot-container {
      width: 100%;
      max-width: 520px;
      margin: 12px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      min-height: 0px;
    }

    .box { background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(16px); border-radius: 20px; padding: 24px; width: 100%; max-width: 520px; box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
    
    .input-wrapper { position: relative; width: 100%; display: flex; align-items: center; margin-bottom: 14px; }
    input[type="text"] { width: 100%; padding: 16px 90px 16px 16px; background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #ff3366; }
    
    .paste-btn { position: absolute; right: 10px; background: rgba(255, 255, 255, 0.12); border: 1px solid var(--border); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .paste-btn:hover { background: rgba(255, 255, 255, 0.2); }

    .btn { width: 100%; padding: 15px 20px; font-size: 1.05rem; font-weight: 700; border-radius: 12px; border: none; cursor: pointer; color: white; background: var(--accent); transition: transform 0.1s; display: flex; justify-content: center; align-items: center; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    #resultSection { display: none; text-align: center; }
    .preview-card { background: rgba(0,0,0,0.3); border-radius: 14px; padding: 16px; border: 1px solid var(--border); }
    .thumb-container { position: relative; display: inline-block; width: 100%; max-width: 320px; margin-bottom: 14px; }
    .thumb-container img { width: 100%; max-height: 350px; border-radius: 10px; object-fit: cover; }
    .quality-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.75); color: var(--success); font-size: 0.75rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
    
    .video-info { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: #fff; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    
    .btn-secondary { margin-top: 14px; background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; font-size: 0.9rem; cursor: pointer; width: 100%; font-weight: 600; }
    
    footer { margin-top: auto; padding: 25px 0; color: var(--muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>Video Downloader</h1>
    <p class="sub">High-Speed Multi-Platform HD Video Downloader Engine.</p>
  </header>

  <!-- TOP BANNER AD SLOT -->
  <div class="ad-slot-container" id="topAdSlot">
    <!-- BANNER_PLACEHOLDER_TOP -->
  </div>

  <main class="box">
    <!-- SEARCH SECTION -->
    <div id="searchSection">
      <div class="input-wrapper">
        <input type="text" id="videoUrl" placeholder="Paste video link here..." autocomplete="off" maxlength="300">
        <button type="button" class="paste-btn" onclick="handlePaste()">Paste</button>
      </div>
      <button class="btn" id="fetchBtn" onclick="handleFetch()">Get Download Link</button>
    </div>

    <!-- RESULT SECTION -->
    <div id="resultSection">
      <div class="preview-card">
        <div class="thumb-container">
          <img id="thumbImg" src="" alt="Media Preview">
          <span class="quality-badge">1080p Full HD</span>
        </div>
        
        <!-- XSS-Safe Label -->
        <div class="video-info" id="videoTitle">Social Video</div>

        <!-- MID BANNER AD SLOT -->
        <div class="ad-slot-container" id="midAdSlot">
          <!-- BANNER_PLACEHOLDER_MID -->
        </div>
        
        <button class="btn" id="dlBtn" onclick="routeOsSpecificDownload()">
          Download HD MP4
        </button>
        
        <button class="btn-secondary" onclick="resetDownloader()">
          ↻ Download Another Video
        </button>
      </div>
    </div>
  </main>

  <!-- BOTTOM BANNER AD SLOT -->
  <div class="ad-slot-container" id="bottomAdSlot">
    <!-- BANNER_PLACEHOLDER_BOTTOM -->
  </div>

  <footer>
    <p>© 2026 Universal Media Downloader. Enterprise Secure Core.</p>
  </footer>

  <script>
    let activeMediaUrl = "";
    const ADSTERRA_DIRECT_LINK = "https://www.profitableratecpmnetwork.com/x2qz4nip?key=d355fb2b34af3a9f086ff05f70e1da29";

    // 1. शुद्ध मोबाइल डिटेक्शन इंजन (iOS Safari vs Android Chrome)
    function isAppleDevice() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      // iPhone, iPad, iPod या iPadOS Safari Desktop मोड की अचूक पहचान
      return (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) && !window.MSStream;
    }

    // 2. विज्ञापन स्लॉट प्रबंधन (iOS पर ब्लैंक बॉक्स से बचाव)
    function configureAdSlots() {
      if (isAppleDevice()) {
        document.querySelectorAll('.ad-slot-container').forEach(slot => {
          slot.style.display = 'none';
        });
      }
    }
    window.addEventListener('DOMContentLoaded', configureAdSlots);

    async function handlePaste() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) document.getElementById("videoUrl").value = text.trim();
      } catch (err) {
        const manual = prompt("Paste your video link here:");
        if (manual) document.getElementById("videoUrl").value = manual.trim();
      }
    }

    async function handleFetch() {
      let rawUrl = document.getElementById("videoUrl").value.trim();
      const btn = document.getElementById("fetchBtn");

      if (!rawUrl || rawUrl.length > 300) {
        alert("Please provide a valid URL.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Processing HD Stream...";

      try {
        const response = await fetch(`/api/info?url=${encodeURIComponent(rawUrl)}`);
        const data = await response.json();

        if (response.ok && data.success) {
          activeMediaUrl = data.download_url;
          
          // सुरक्षित DOM असाइनमेंट (XSS सुरक्षा)
          document.getElementById("videoTitle").textContent = data.title || "Social Video";
          if (data.thumbnail) {
            document.getElementById("thumbImg").src = data.thumbnail;
          }

          document.getElementById("searchSection").style.display = "none";
          document.getElementById("resultSection").style.display = "block";
        } else {
          alert(data.detail || "Unable to extract media. Verify link visibility.");
        }
      } catch (err) {
        alert("Network or verification error. Please retry.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Get Download Link";
      }
    }

    // 3. पृथक डाउनलोड निष्पादन (Dual-OS Architecture)
    function routeOsSpecificDownload() {
      if (!activeMediaUrl) return;

      // पहली मिलीसेकंड में Adsterra स्मार्टलिंक (पॉप-अप ब्लॉकर बाईपास)
      window.open(ADSTERRA_DIRECT_LINK, "_blank");

      const streamEndpoint = `/api/stream?url=${encodeURIComponent(activeMediaUrl)}`;

      if (isAppleDevice()) {
        // [iOS Safari Pipeline]:
        // Safari पर डायरेक्ट लोकेशन नेविगेशन अनिवार्य है ताकि Safari का नेटिव 
        // "Do you want to download?" सिस्टम प्रॉम्प्ट ट्रिगर हो और फाइल सीधे Files App में जाए।
        window.location.href = streamEndpoint;
      } else {
        // [Android / Chrome Pipeline]:
        // बैकग्राउंड इनविजिबल फ्रेम + एंकर टैग क्रोम डाउनलोड मैनेजर को सीधे नोटिफिकेशन ट्रे में ट्रिगर करता है।
        const dlFrame = document.createElement("iframe");
        dlFrame.style.display = "none";
        dlFrame.src = streamEndpoint;
        document.body.appendChild(dlFrame);

        const a = document.createElement("a");
        a.href = streamEndpoint;
        a.setAttribute("download", "Social_Video.mp4");
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(dlFrame);
          document.body.removeChild(a);
        }, 4000);
      }
    }

    function resetDownloader() {
      document.getElementById("videoUrl").value = "";
      document.getElementById("resultSection").style.display = "none";
      document.getElementById("searchSection").style.display = "block";
      activeMediaUrl = "";
    }
  </script>
</body>
</html>
