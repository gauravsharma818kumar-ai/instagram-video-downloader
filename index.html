<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AllSavePro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b1120; /* बैकग्राउंड डार्क शेड */
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* 1. हेडर (AllSavePro) */
    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.2rem;
      color: #38bdf8; /* स्क्रीनशॉट वाला ब्राइट ब्लू रंग */
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* 2. टॉप एड स्लॉट */
    .ad-banner-top {
      width: 100%;
      margin-bottom: 18px;
      border-radius: 6px;
      overflow: hidden;
      text-align: center;
      min-height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 3. डार्क कार्ड (सर्च बॉक्स) */
    .search-card {
      background-color: #1a2332; /* स्क्रीनशॉट का कार्ड कलर */
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    /* इनपुट और पेस्ट बटन की रो */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .input-row input {
      flex: 1;
      background-color: #0d1526;
      border: 1px solid #2a364f;
      border-radius: 8px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }

    .input-row input::placeholder {
      color: #64748b;
    }

    .input-row input:focus {
      border-color: #38bdf8;
    }

    .btn-paste {
      background-color: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-paste:hover {
      background-color: #475569;
    }

    /* मुख्य सर्च बटन */
    .btn-search {
      width: 100%;
      background-color: #0284c7; /* स्क्रीनशॉट वाला ब्लू बटन */
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-search:hover {
      background-color: #0369a1;
    }

    /* रिजल्ट कार्ड */
    .result-card {
      display: none;
      background-color: #1a2332;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      text-align: center;
    }

    .thumb-box {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .thumb-box img {
      width: 100%;
      display: block;
    }

    .video-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: #e2e8f0;
    }

    .btn-reset {
      width: 100%;
      background-color: #334155;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- हेडर -->
    <header>
      <h1>AllSavePro</h1>
    </header>

    <!-- टॉप एड स्लॉट -->
    <div class="ad-banner-top" id="homeAdSlot">
      <!-- यहाँ आपकी बैनर एड स्क्रिप्ट लोड होगी -->
    </div>

    <!-- सर्च सेक्शन (स्क्रीनशॉट के अनुसार) -->
    <div class="search-card" id="searchSection">
      <div class="input-row">
        <input type="text" id="videoUrl" placeholder="Paste media link here..." onkeydown="if(event.key==='Enter') handleFetch()">
        <button class="btn-paste" onclick="handlePaste()">Paste</button>
      </div>
      <button class="btn-search" id="fetchBtn" onclick="handleFetch()">
        🔍 Search & Get Download Link
      </button>
    </div>

    <!-- रिजल्ट सेक्शन -->
    <div class="result-card" id="resultSection">
      <div class="thumb-box">
        <img id="thumbImg" src="" alt="Thumbnail">
      </div>
      <div class="video-title" id="videoTitle">Media Video</div>
      <button class="btn-search" id="downloadBtn" onclick="routeOsSpecificDownload()">Download HD MP4</button>
      <button class="btn-reset" onclick="resetDownloader()">Download Another Video</button>
      
      <div id="resultBannerSlot" style="margin-top: 15px;"></div>
    </div>
  </div>

  <script>
    const AD_LINK = "https://www.profitableratecpmnetwork.com/x2qz4nip?key=d355fb2b34af3a9f086ff05f70e1da29";
    let activeMediaUrl = "";

    // पेस्ट बटन फ़ंक्शन
    async function handlePaste() {
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text) {
            document.getElementById("videoUrl").value = text.trim();
            return;
          }
        }
        const manual = prompt("Paste your video link here:");
        if (manual) document.getElementById("videoUrl").value = manual.trim();
      } catch (err) {
        const manual = prompt("Paste your video link here:");
        if (manual) document.getElementById("videoUrl").value = manual.trim();
      }
    }

    // एपीआई फेच फ़ंक्शन
    async function handleFetch() {
      const urlInput = document.getElementById("videoUrl");
      const rawUrl = urlInput ? urlInput.value.trim() : "";
      const btn = document.getElementById("fetchBtn");

      if (!rawUrl || !rawUrl.startsWith("http")) {
        alert("Please enter a valid video link.");
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.innerText = "Processing...";
      }

      try {
        const response = await fetch(`/api/info?url=${encodeURIComponent(rawUrl)}`);
        const data = await response.json();

        if (response.ok && data && data.success) {
          activeMediaUrl = data.download_url;
          document.getElementById("videoTitle").textContent = data.title || "Media Video";
          document.getElementById("thumbImg").src = data.thumbnail || "";
          
          document.getElementById("searchSection").style.display = "none";
          document.getElementById("resultSection").style.display = "block";
        } else {
          alert((data && data.detail) || "Unable to fetch video.");
        }
      } catch (err) {
        alert("Network error. Try again.");
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = "🔍 Search & Get Download Link";
        }
      }
    }

    // डाउनलोड बटन और एड रीडायरेक्ट
    function routeOsSpecificDownload() {
      if (!activeMediaUrl) return;

      const dlBtn = document.getElementById("downloadBtn");
      if (dlBtn) {
        dlBtn.disabled = true;
        dlBtn.innerText = "Preparing Download (2s)...";
      }

      // 1st Action: नए टैब में एड खोलना
      try { window.open(AD_LINK, "_blank"); } catch (e) {}

      // 2nd Action: बैकग्राउंड में नेटिव फ़ाइल डाउनलोड शुरू करना
      setTimeout(() => {
        const streamEndpoint = `/api/stream?url=${encodeURIComponent(activeMediaUrl)}&_t=${Date.now()}`;
        const a = document.createElement("a");
        a.href = streamEndpoint;
        a.setAttribute("download", "Video.mp4");
        a.target = "_self";
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => { document.body.removeChild(a); }, 1000);

        if (dlBtn) {
          dlBtn.disabled = false;
          dlBtn.innerText = "Download HD MP4";
        }
      }, 2000);
    }

    function resetDownloader() {
      document.getElementById("videoUrl").value = "";
      document.getElementById("resultSection").style.display = "none";
      document.getElementById("searchSection").style.display = "block";
      activeMediaUrl = "";
    }
  </script>
</body>
</html>
