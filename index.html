  <style>
    :root {
      --bg: #0b0f19;
      --card: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --accent: linear-gradient(135deg, #ff3366, #ff6b3d, #c32aa3);
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    header { text-align: center; margin-top: 40px; margin-bottom: 30px; max-width: 650px; }
    h1 { font-size: 2.2rem; font-weight: 800; background: var(--accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
    p.sub { color: var(--muted); font-size: 1rem; line-height: 1.5; }
    .box { background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(12px); border-radius: 16px; padding: 24px; width: 100%; max-width: 600px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .input-group { display: flex; gap: 8px; flex-direction: column; }
    input[type="text"] { width: 100%; padding: 14px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #ff3366; }
    .btn { padding: 14px 20px; font-size: 1rem; font-weight: 700; border-radius: 10px; border: none; cursor: pointer; color: white; background: var(--accent); transition: transform 0.1s, opacity 0.2s; display: flex; justify-content: center; align-items: center; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #result { margin-top: 24px; display: none; text-align: center; }
    .preview-card { background: rgba(0,0,0,0.25); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
    .preview-card img { max-width: 100%; max-height: 280px; border-radius: 8px; object-fit: cover; margin-bottom: 14px; }
    footer { margin-top: auto; padding: 20px 0; color: var(--muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>Instagram Video Downloader</h1>
    <p class="sub">Download reels, videos, and media instantly in full HD quality. Safe, private, and unlimited.</p>
  </header>

  <main class="box">
    <div class="input-group">
      <input type="text" id="videoUrl" placeholder="Paste Instagram link here (e.g. https://www.instagram.com/reel/...)" autocomplete="off">
      <button class="btn" id="fetchBtn" onclick="handleFetch()">Get Download Link</button>
    </div>

    <div id="result">
      <div class="preview-card">
        <img id="thumbImg" src="" alt="Video Preview">
        <h3 id="videoTitle" style="font-size:1rem; margin-bottom:14px; font-weight:600;"></h3>
        <button class="btn" style="width:100%;" id="dlBtn" onclick="triggerDownload()">Download HD MP4</button>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 Insta Video Downloader. Zero logs, high-speed direct stream.</p>
  </footer>

  <script>
    let activeDownloadUrl = "";
    // Adsterra Smartlink integrated
    const ADSTERRA_DIRECT_LINK = "https://www.profitableratecpmnetwork.com/x2qz4nip?key=d355fb2b34af3a9f086ff05f70e1da29";

    async function handleFetch() {
      const urlInput = document.getElementById("videoUrl").value.trim();
      const btn = document.getElementById("fetchBtn");
      const resultDiv = document.getElementById("result");

      if (!urlInput) {
        alert("Please paste a valid link first.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Processing...";
      resultDiv.style.display = "none";

      try {
        const response = await fetch(`/api/info?url=${encodeURIComponent(urlInput)}`);
        const data = await response.json();

        if (response.ok && data.success) {
          activeDownloadUrl = data.download_url;
          document.getElementById("videoTitle").innerText = data.title || "Instagram Video";
          if (data.thumbnail) {
            document.getElementById("thumbImg").src = data.thumbnail;
            document.getElementById("thumbImg").style.display = "inline-block";
          } else {
            document.getElementById("thumbImg").style.display = "none";
          }
          resultDiv.style.display = "block";
        } else {
          alert(data.detail || "Unable to extract video. Please check the link.");
        }
      } catch (err) {
        alert("Network error. Please try again.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Get Download Link";
      }
    }

    function triggerDownload() {
      if (!activeDownloadUrl) return;

      // 1. Monetization: Background ad window trigger
      window.open(ADSTERRA_DIRECT_LINK, "_blank");

      // 2. Direct Video Download trigger
      const a = document.createElement("a");
      a.href = activeDownloadUrl;
      a.target = "_blank";
      a.download = "instagram_video.mp4";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
